<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphL — visual courses and hands-on labs</title>
    <meta
      name="description"
      content="GraphL — technical concepts taught as diagrams that assemble themselves, beat by beat, in sync with the narration, plus hands-on labs you work through yourself."
    />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <!-- Applies a stored theme choice BEFORE first paint. This has to be inline and blocking: as a
         module or a deferred file it would run after the page has already painted, and every load
         would flash the wrong background. No stored value means "system", which needs no attribute
         — the stylesheet's prefers-color-scheme query handles it. Deliberately tiny and
         dependency-free; theme.js does everything else once the page is up. -->
    <script>
      try {
        var t = localStorage.getItem('graphl:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Site chrome: brand on the left, section nav on the right. The nav is EMPTY here on purpose
         — app.js builds it from catalog.json's `kinds`, so adding a section never means editing
         this file. The links it writes are real anchors to #<kind>, so activation, keyboard,
         middle-click and copy-link all come for free; app.js only marks which one is current. -->
    <header class="site">
      <div class="site__inner">
        <a class="site__brand" href="#courses">
          <img class="site__logo" src="icon.svg" alt="" width="28" height="28" />
          <span class="site__name">GraphL</span>
        </a>
        <div class="site__right">
          <nav class="site__nav" id="nav" aria-label="Sections"></nav>
          <!-- Cycles system → light → dark. Rendered empty; theme.js fills the glyph and the
               label so the markup never disagrees with the active theme. -->
          <button class="site__icon" id="theme" type="button"></button>
        </div>
      </div>
    </header>

    <main class="idx">
      <!-- The nav's current item is the visible "you are here", and the cards are numbered, so the
           page needs no heading or count of its own. The <h1> is kept for structure only. -->
      <h1 class="sr-only" id="subject">Courses</h1>
      <ol id="catalog" class="idx__grid">
        <li class="idx__empty">Loading catalog…</li>
      </ol>
    </main>
    <script type="module" src="theme.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
