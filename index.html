<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphL — visual courses and hands-on labs</title>
    <meta
      name="description"
      content="GraphL — technical concepts taught as diagrams that assemble themselves, beat by beat, in sync with the narration, plus hands-on labs you work through yourself."
    />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Site chrome: brand on the left, section nav on the right. The links are real anchors to
         #courses / #labs, so activation, keyboard, middle-click and copy-link all come for free —
         app.js only marks which one is current. -->
    <header class="site">
      <div class="site__inner">
        <a class="site__brand" href="#courses">
          <img class="site__logo" src="icon.svg" alt="" width="28" height="28" />
          <span class="site__name">GraphL</span>
        </a>
        <nav class="site__nav" aria-label="Sections">
          <a
            class="site__link"
            href="#courses"
            data-section="courses"
            data-title="Courses"
            data-noun="course"
            data-blurb="Each concept taught as diagrams that assemble themselves, beat by beat, in sync with the narration."
            >Courses</a
          >
          <a
            class="site__link"
            href="#labs"
            data-section="labs"
            data-title="Labs"
            data-noun="lab"
            data-blurb="The hands-on half — work through it yourself, step by step, alongside the matching course."
            >Labs</a
          >
        </nav>
      </div>
    </header>

    <main class="idx">
      <!-- The nav already shows which section you are in, so the heading is for structure and
           screen readers only. The visible line explains what this section IS — the one thing a
           first-time visitor can't infer from the nav. -->
      <h1 class="sr-only" id="subject">Courses</h1>
      <p class="idx__blurb">
        <span id="blurb"
          >Each concept taught as diagrams that assemble themselves, beat by beat, in sync with the
          narration.</span
        >
        <span class="idx__count" id="count"></span>
      </p>
      <ol id="catalog" class="idx__grid">
        <li class="idx__empty">Loading catalog…</li>
      </ol>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
